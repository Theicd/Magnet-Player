<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>נגן מגנט וובי</title>
  <style>
    body { margin: 0; background: #0f1115; color: #f5f5f5; font-family: Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    label { font-size: 0.95rem; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #2c2f38; background: #181b21; color: #fff; width: 100%; box-sizing: border-box; }
    button { padding: 10px 16px; border: none; border-radius: 6px; background: #f97316; color: #fff; font-size: 1rem; cursor: pointer; width: fit-content; }
    button:hover { background: #fb923c; }
    #status { min-height: 1.8rem; color: #ffd29d; }
    video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>נגן מגנט וובי</h1>
  <label for="magnet">הדבק כאן קישור magnet (עם טראקרים התומכים ב-WebRTC):</label>
  <input id="magnet" placeholder="magnet:?xt=urn:btih..." />
  <button id="play">התחל</button>
  <div id="status"></div>
  <video id="video" controls></video>

  <script src="https://cdn.jsdelivr.net/npm/webtorrent@1.9.7/webtorrent.min.js"></script>
  <script>
    const client = new WebTorrent()
    const magnetInput = document.getElementById('magnet')
    const playBtn = document.getElementById('play')
    const statusEl = document.getElementById('status')
    const videoEl = document.getElementById('video')

    function pickVideo (files) {
      return files
        .filter(f => /\.(mp4|webm|mkv|mov|avi)$/i.test(f.name))
        .sort((a, b) => (b.length || 0) - (a.length || 0))[0]
    }

    playBtn.addEventListener('click', () => {
      const magnet = (magnetInput.value || '').trim()
      if (!/^magnet:/i.test(magnet)) {
        statusEl.textContent = 'נא להזין קישור magnet תקין'
        return
      }
      statusEl.textContent = 'מתחבר לטורנט...'
      videoEl.removeAttribute('src')
      videoEl.load()

      client.add(magnet, torrent => {
        const file = pickVideo(torrent.files)
        if (!file) {
          statusEl.textContent = 'לא נמצא קובץ וידאו בטורנט'
          torrent.destroy()
          return
        }
        statusEl.textContent = `מנגן: ${file.name}`
        file.renderTo(videoEl, { autoplay: true }, err => {
          if (err) statusEl.textContent = 'שגיאה בהזרמה'
        })
      })
    })
  </script>
</body>
</html>
