<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Magnet Player</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: Arial, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 20px; }
    header { font-size: 1.4rem; }
    label { font-size: 0.95rem; }
    input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1b1d22; color: #fff; width: 100%; }
    button { padding: 10px 14px; border: none; border-radius: 4px; background: #e26d12; color: #fff; cursor: pointer; font-size: 1rem; }
    button:hover { background: #ff7f1f; }
    video { width: 100%; max-height: 70vh; background: #000; border-radius: 6px; }
    #status { min-height: 1.6rem; }
  </style>
</head>
<body>
  <header>נגן מגנט מינימלי</header>
  <section>
    <label for="magnet">הדבק קישור magnet:</label>
    <input id="magnet" type="text" placeholder="magnet:?xt=urn:btih...">
  </section>
  <section>
    <button id="play">התחל ניגון</button>
  </section>
  <section id="status"></section>
  <section>
    <video id="video" controls></video>
  </section>
  <script src="renderer.js"></script>
</body>
</html>
